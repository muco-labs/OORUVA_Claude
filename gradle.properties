# Tuned for an 8 GB machine: keep the Gradle + Kotlin daemons modest so they
# do not fight each other for RAM.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
kotlin.code.style=official
