name: CI

# Pull requests and pushes to main. Release signing is deliberately not here —
# see the note on the android job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Android builds are slow
# and there is no value in finishing a run for a commit nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # The migrations and the negative-security suites.
  #
  # First job on purpose: it is the fastest and it is the one that catches the
  # class of bug that matters most. A broken RLS policy that lets one vendor
  # read another's documents is worse than anything the compilers can find.
  # ==========================================================================
  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations and run security suites
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run_tests.sh

  # ==========================================================================
  # Admin console
  # ==========================================================================
  admin:
    name: Admin console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        # No Supabase keys are supplied. The bundle must build without them —
        # if a build ever starts requiring a key, that key would have to live in
        # CI, and from there it is one careless log line from being public.
        run: npm run build

  # ==========================================================================
  # Android, both flavours
  # ==========================================================================
  android:
    name: Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Customer, Vendor]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        # lintVital already runs as part of assembleRelease, but running it up
        # front means a lint failure is reported as a lint failure rather than
        # as a mysterious release-build failure seven minutes in.
        run: ./gradlew lint${{ matrix.flavor }}Debug

      - name: Unit tests
        run: ./gradlew test${{ matrix.flavor }}DebugUnitTest

      - name: Assemble debug
        run: ./gradlew assemble${{ matrix.flavor }}Debug

      # Release is compiled but NOT signed. Signing needs a keystore, and a
      # keystore in CI is a keystore that can be exfiltrated by any workflow
      # change that lands on the default branch. Signed builds are produced from
      # a protected release workflow with environment approval, which is a
      # separate change and is not part of this pipeline.
      - name: Compile release (unsigned)
        run: ./gradlew assemble${{ matrix.flavor }}Release

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.flavor }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ooruva-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
